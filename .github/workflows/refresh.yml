# Re-pulls prices, company profiles and earnings from Yahoo after the US market
# close (earnings only for companies reporting soon, except Fridays), rebuilds the
# dataset, model scores and calendar data, and publishes the result.
# If the pull comes back short (for example Yahoo blocking the runner), the
# job fails before publishing and the previous page stays up.
name: Refresh data and publish

on:
  schedule:
    - cron: "15 22 * * 1-5"   # weekdays 22:15 UTC: after the 4pm ET close in both summer and winter time
  workflow_dispatch:
    inputs:
      full:
        description: Re-pull earnings for every company
        type: boolean
        default: false

permissions:
  contents: write   # to push the daily snapshot to the snapshots branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run collect_data.py prices
      # Earnings files carry over between runs so most days only need a partial pull.
      - uses: actions/cache@v4
        with:
          path: data/raw/earnings
          key: earnings-${{ github.run_id }}
          restore-keys: earnings-
      - name: Pull earnings (every company on Fridays, otherwise those reporting within 2 weeks)
        run: |
          if [ "$(date -u +%u)" = "5" ] || [ "${{ inputs.full }}" = "true" ]; then
            uv run collect_data.py earnings --refresh
          else
            uv run collect_data.py earnings --within-days 14
          fi
      - run: uv run collect_data.py profiles
      # Analyst, estimate, short-interest and options data for companies reporting soon.
      # Yahoo only serves current values, so each day's file is kept on the snapshots
      # branch to build a history. A failure here does not stop the refresh.
      - name: Restore earlier snapshots and prediction logs
        run: |
          git fetch origin snapshots:snapshots || true
          if git show-ref --quiet refs/heads/snapshots; then
            git worktree add ../snapshots snapshots
          else
            git worktree add --orphan -b snapshots ../snapshots
          fi
          mkdir -p data/snapshots data/predictions ../snapshots/predictions
          cp ../snapshots/*.parquet data/snapshots/ 2>/dev/null || true
          cp ../snapshots/predictions/*.parquet data/predictions/ 2>/dev/null || true
      - name: Take today's snapshot
        continue-on-error: true
        run: uv run collect_snapshot.py --within-days 14
      - run: uv run collect_data.py combine --min-tickers 800
      - run: uv run build_dataset.py
      - run: uv run train_model.py
      # Each day's model predictions are logged next to the snapshots, so they can be
      # compared with what happened after each report.
      - name: Save the snapshot and prediction log
        continue-on-error: true
        run: |
          cp data/snapshots/*.parquet ../snapshots/ || true
          cp data/predictions/*.parquet ../snapshots/predictions/ || true
          cd ../snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "Snapshot $(date -u +%F)" && git push -q origin snapshots)
      - run: uv run build_calendar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
