<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earnings">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Earnings Calendar</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --text: #16191f; --muted: #6a7280;
    --accent: #2456d6; --hot: #d1432b; --today: #eef3ff; --shade: rgba(0, 0, 0, .35);
    --bmo-bg: #fff3d6; --bmo-fg: #7a5200; --amc-bg: #e4e9ff; --amc-fg: #2a3a9a;
    --during-bg: #e6f4ea; --during-fg: #1d6b37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --panel: #1a1d24; --line: #2b303a; --text: #e8eaee; --muted: #9099a8;
      --accent: #7da2ff; --hot: #ff7a5c; --today: #1c2540; --shade: rgba(0, 0, 0, .55);
      --bmo-bg: #453510; --bmo-fg: #ffd98a; --amc-bg: #262f63; --amc-fg: #c3ccff;
      --during-bg: #173622; --during-fg: #9fe0b3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0; }
  .quarter { color: var(--muted); font-size: 13px; margin-right: 6px; }
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav strong { min-width: 170px; text-align: center; font-size: 15px; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel);
                          border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .toggle { display: flex; }
  .toggle button { border-radius: 0; }
  .toggle button:first-child { border-radius: 6px 0 0 6px; }
  .toggle button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .toggle button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=search] { width: 180px; }
  .legend { display: flex; gap: 10px; margin-left: auto; color: var(--muted); font-size: 12px; align-items: center; }
  .chip { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600; }
  .bmo { background: var(--bmo-bg); color: var(--bmo-fg); }
  .amc { background: var(--amc-bg); color: var(--amc-fg); }
  .during { background: var(--during-bg); color: var(--during-fg); }
  main { padding: 14px 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .dow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 0 4px; }
  .day { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 112px;
         padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .day:hover { border-color: var(--accent); }
  .day.out { opacity: .4; }
  .day.today { background: var(--today); }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; }
  .day-num { font-weight: 600; }
  .count { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .more { color: var(--muted); font-size: 12px; }
  .chip.hot { box-shadow: 0 0 0 1.5px var(--hot); }
  .move { font-size: 12px; white-space: nowrap; text-align: right; }
  .move .p { font-weight: 600; }
  .move .p.hot { color: var(--hot); }
  .move .past { color: var(--muted); }
  .week .day { min-height: 60vh; }
  .week h3 { margin: 6px 0 2px; }
  .wrow { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .wrow .name { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  #shade { position: fixed; inset: 0; background: var(--shade); z-index: 3; display: none; }
  #detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel);
            border-left: 1px solid var(--line); z-index: 4; padding: 16px; overflow: auto; display: none; }
  body.open #shade, body.open #detail { display: block; }
  #detail h2 { font-size: 16px; margin: 0 0 2px; }
  #detail .sub { color: var(--muted); font-size: 12px; }
  /* Stays visible while the list scrolls, and clears the iPhone status bar / notch. */
  .drawer-bar { position: sticky; top: -16px; z-index: 1; margin: -16px -16px 10px; padding: 10px 12px;
                padding-top: max(10px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--line); }
  #close { font-weight: 600; }
  .row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto auto; gap: 8px; padding: 6px 0;
         border-top: 1px solid var(--line); align-items: baseline; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .eps { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
  .star { border: 0; background: none; padding: 0 2px; font-size: 16px; color: var(--muted); line-height: 1; }
  .star.on { color: #e0a800; }
  .watch-add { display: flex; gap: 6px; margin: 12px 0; }
  .watch-add input { flex: 1; min-width: 0; }
  .watch-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .watch-item .meta { color: var(--muted); font-size: 12px; }
  .sortbar { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .sortbar select { padding: 2px 6px; font-size: 12px; }
  .row button { padding: 2px 8px; font-size: 12px; }
  footer { color: var(--muted); font-size: 12px; padding: 0 16px 20px; }
  .mini { display: none; color: var(--muted); font-size: 11px; line-height: 1.3; }
  .mini .hotcount { color: var(--hot); font-weight: 600; }
  @media (max-width: 640px) {
    header { padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); gap: 8px; }
    h1 { font-size: 16px; }
    .nav strong { min-width: 0; flex: 1; }
    .nav { flex: 1 1 100%; }
    input[type=search] { flex: 1; width: auto; min-width: 0; }
    .legend { margin-left: 0; flex-basis: 100%; flex-wrap: wrap; gap: 4px 10px; }
    .legend > span { white-space: nowrap; }
    main { padding: 10px 8px; }
    footer { padding: 0 12px calc(16px + env(safe-area-inset-bottom)); }
    /* Month: day number and counts only; tap a day for the list. */
    .month .day { min-height: 62px; padding: 5px; }
    .month .chips, .month .more, .month .count { display: none; }
    .month .mini { display: block; }
    /* Week: one day per row, like an agenda. */
    .week #dow { display: none; }
    .week .grid { grid-template-columns: 1fr; }
    .week .day { min-height: 0; }
    /* Detail rows: name gets the full line, numbers go underneath. */
    .row { grid-template-columns: 58px minmax(0, 1fr) auto; }
    .row .stats { grid-column: 2 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
    .row .stats .move { display: contents; }
    .row .stats .eps, .row .stats .move { text-align: left; }
    #detail { width: 100vw; }
    button, select, input { padding: 8px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>Earnings Calendar</h1>
  <span class="quarter" id="quarter"></span>
  <div class="toggle">
    <button id="view-month">Month</button><button id="view-week">Week</button>
  </div>
  <div class="nav">
    <button id="prev" aria-label="Previous">&larr;</button>
    <strong id="title"></strong>
    <button id="next" aria-label="Next">&rarr;</button>
    <button id="today">Today</button>
  </div>
  <input id="search" type="search" placeholder="Ticker or company">
  <select id="scope" aria-label="Companies shown">
    <option value="top">Largest 500</option>
    <option value="watch">My watchlist</option>
    <option value="all">All companies</option>
  </select>
  <select id="sector" aria-label="Sector"><option value="">All sectors</option></select>
  <button id="edit-watch">Edit watchlist</button>
  <div class="legend">
    <span><span class="chip bmo">ABC</span> before open</span>
    <span><span class="chip amc">ABC</span> after close</span>
    <span><span class="chip bmo hot">ABC</span> likely big mover</span>
  </div>
</header>
<main>
  <div class="grid" id="dow"></div>
  <div class="grid" id="grid" style="margin-top:6px"></div>
</main>
<footer id="footer"></footer>
<div id="shade"></div>
<aside id="detail"><div class="drawer-bar"><button id="close">&lsaquo; Back to calendar</button></div><div id="detail-body"></div></aside>

<script src="calendar_data.js"></script>
<script>
const DATA = window.EARNINGS_CALENDAR || { events: [], generated: "never" };
const MAX_CHIPS = 8;
const HOT = 0.6;   // chance of a 5%+ move at which a company is flagged
let detailSort = "mcap", detailKey = null;
const hot = e => e.p_big_move != null && e.p_big_move >= HOT ? " hot" : "";
const pct = (v, d = 0) => `${(v * 100).toFixed(d)}%`;
const SESSIONS = ["bmo", "during", "amc"];
const SESSION_LABEL = { bmo: "Before open", amc: "After close", during: "During session" };
const el = id => document.getElementById(id);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const monday = d => { const m = new Date(d); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); m.setHours(0, 0, 0, 0); return m; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayIso = iso(new Date());

// Navigation is limited to the quarter the data covers.
const qStart = parse(DATA.quarter_start || todayIso), qEnd = parse(DATA.quarter_end || todayIso);
const clamp = d => d < qStart ? new Date(qStart) : d > qEnd ? new Date(qEnd) : d;

let mode = "month";
let cursor = clamp(new Date());   // any date inside the month or week being shown

for (const s of [...new Set(DATA.events.map(e => e.sector))].sort()) el("sector").add(new Option(s, s));
el("quarter").textContent = DATA.quarter || "";

// Watchlist lives in this browser only.
function loadWatch() {
  try { return new Set(JSON.parse(localStorage.getItem("watchlist") || "[]")); } catch { return new Set(); }
}
let watch = loadWatch();
function saveWatch() {
  try { localStorage.setItem("watchlist", JSON.stringify([...watch].sort())); } catch { /* storage unavailable */ }
}

function filtered() {
  const q = el("search").value.trim().toLowerCase();
  const sector = el("sector").value;
  const scope = el("scope").value;
  return DATA.events.filter(e =>
    (scope === "all" || (scope === "top" ? e.top : watch.has(e.ticker))) &&
    (!sector || e.sector === sector) &&
    (!q || e.ticker.toLowerCase().startsWith(q) || e.company.toLowerCase().includes(q)));
}

function byDate(events) {
  const map = new Map();
  for (const e of events) { if (!map.has(e.date)) map.set(e.date, []); map.get(e.date).push(e); }
  return map;
}

function fmtCap(m) {
  if (m == null) return "";
  return m >= 1e6 ? `$${(m / 1e6).toFixed(2)}T` : m >= 1e3 ? `$${(m / 1e3).toFixed(1)}B` : `$${Math.round(m)}M`;
}

function dayCell(d, list, outside) {
  const key = iso(d);
  const cell = document.createElement("div");
  cell.className = "day" + (outside ? " out" : "") + (key === todayIso ? " today" : "");
  let body;
  if (mode === "month") {
    body = `<div class="chips">` + list.slice(0, MAX_CHIPS).map(e =>
      `<span class="chip ${e.session}${hot(e)}" title="${e.company}">${e.ticker}</span>`).join("") + `</div>` +
      (list.length > MAX_CHIPS ? `<span class="more">+${list.length - MAX_CHIPS} more</span>` : "");
  } else {
    body = SESSIONS.map(s => {
      const group = list.filter(e => e.session === s);
      return group.length ? `<h3>${SESSION_LABEL[s]} (${group.length})</h3>` + group.map(e =>
        `<div class="wrow"><span class="chip ${e.session}${hot(e)}">${e.ticker}</span><span class="name">${e.company}</span></div>`).join("") : "";
    }).join("");
  }
  const label = mode === "month" ? d.getDate() : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const hotCount = list.filter(e => hot(e)).length;
  const mini = list.length ? `<div class="mini">${list.length}` +
    (hotCount ? ` · <span class="hotcount">${hotCount} big</span>` : "") + `</div>` : "";
  cell.innerHTML = `<div class="day-head"><span class="day-num">${label}</span>` +
    `<span class="count">${list.length || ""}</span></div>${mini}${body}`;
  cell.onclick = () => openDetail(key);
  return cell;
}

function render() {
  const events = filtered();
  const map = byDate(events);
  const grid = el("grid"); grid.innerHTML = "";
  grid.parentElement.className = mode;
  el("view-month").classList.toggle("on", mode === "month");
  el("view-week").classList.toggle("on", mode === "week");

  let first, last;
  if (mode === "month") {
    const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
    first = monday(monthStart); last = addDays(monday(monthEnd), 4);
    el("title").textContent = monthStart.toLocaleString("en-US", { month: "long", year: "numeric" });
    el("prev").disabled = monthStart <= qStart;
    el("next").disabled = monthEnd >= qEnd;
  } else {
    first = monday(cursor); last = addDays(first, 4);
    const fmt = { month: "short", day: "numeric" };
    el("title").textContent = `${first.toLocaleDateString("en-US", fmt)} – ${last.toLocaleDateString("en-US", fmt)}, ${last.getFullYear()}`;
    el("prev").disabled = first <= qStart;
    el("next").disabled = addDays(first, 7) > qEnd;
  }
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const outside = mode === "month" && d.getMonth() !== cursor.getMonth();
    grid.appendChild(dayCell(d, map.get(iso(d)) || [], outside));
  }
  el("footer").textContent = `${events.length} reports from today through the end of ${DATA.quarter}. ` +
    `Dates from Yahoo Finance, pulled ${DATA.generated}. Largest ${DATA.top_n} ranked by market value as of ${DATA.caps_as_of}. ` +
    `Dates can move until a company confirms them. ` +
    (DATA.scores_as_of ? `Move chances are a model estimate of a 5% or larger move in either direction, using prices through ${DATA.scores_as_of}; they say nothing about direction.` : "");
}

function openDetail(key) {
  detailKey = key;
  const list = [...(byDate(filtered()).get(key) || [])];
  if (detailSort === "move") list.sort((a, b) => (b.p_big_move ?? -1) - (a.p_big_move ?? -1));
  const title = parse(key).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  let html = `<h2>${title}</h2><div class="sub">${list.length} ${list.length === 1 ? "company reports" : "companies report"}</div>` +
    `<div class="sortbar">Sort by <select id="detail-sort"><option value="mcap">Market cap</option>` +
    `<option value="move"${detailSort === "move" ? " selected" : ""}>Chance of a big move</option></select></div>`;
  for (const s of SESSIONS) {
    const group = list.filter(e => e.session === s);
    if (!group.length) continue;
    html += `<h3>${SESSION_LABEL[s]} (${group.length})</h3>`;
    for (const e of group) {
      const eps = e.eps_est == null ? "" : `EPS est ${e.eps_est.toFixed(2)}`;
      const move = e.p_big_move == null ? "" :
        `<div class="move"><div class="p${hot(e)}" title="Model's chance of a 5% or larger move, up or down">${pct(e.p_big_move)} chance of ±5%</div>` +
        (e.past_move == null ? "" : `<div class="past" title="Average absolute move on its last 8 reports">past avg ±${pct(e.past_move, 1)}</div>`) + `</div>`;
      html += `<div class="row"><span class="chip ${e.session}">${e.ticker}</span>` +
        `<div><div class="name">${e.company}</div><div class="meta">${[e.sector, fmtCap(e.mcap_m)].filter(Boolean).join(" · ")}</div></div>` +
        `<div class="stats">${move}<div class="eps">${eps}</div></div>` +
        `<button class="star${watch.has(e.ticker) ? " on" : ""}" data-star="${e.ticker}" title="Add to or remove from watchlist">${watch.has(e.ticker) ? "★" : "☆"}</button>` +
        `</div>`;
    }
  }
  el("detail-body").innerHTML = html;
  el("detail-sort").onchange = ev => { detailSort = ev.target.value; openDetail(detailKey); };
  for (const b of el("detail-body").querySelectorAll("[data-star]")) b.onclick = () => {
    const t = b.dataset.star;
    watch.has(t) ? watch.delete(t) : watch.add(t);
    saveWatch(); render(); openDetail(detailKey);
  };
  showDrawer();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function openWatchlist() {
  const byTicker = new Map(DATA.events.map(e => [e.ticker, e]));
  const items = [...watch].sort().map(t => {
    const e = byTicker.get(t);
    const info = e ? `${esc(e.company)} · reports ${e.date}` : "no report on the calendar this quarter";
    return `<div class="watch-item"><div><strong>${esc(t)}</strong> <span class="meta">${info}</span></div>` +
      `<button data-remove="${esc(t)}">Remove</button></div>`;
  }).join("");
  el("detail-body").innerHTML = `<h2>My watchlist</h2><div class="sub">${watch.size} tickers, saved in this browser</div>` +
    `<form class="watch-add" id="watch-form"><input id="watch-input" placeholder="Add tickers, e.g. NFLX, WMT"><button>Add</button></form>` +
    (items || `<div class="sub">Nothing here yet. Add tickers above, or use the star next to a company.</div>`);
  el("watch-form").onsubmit = ev => {
    ev.preventDefault();
    for (const t of el("watch-input").value.toUpperCase().split(/[^A-Z.\-]+/).filter(Boolean)) watch.add(t);
    saveWatch(); render(); openWatchlist();
  };
  for (const b of el("detail-body").querySelectorAll("[data-remove]")) b.onclick = () => {
    watch.delete(b.dataset.remove); saveWatch(); render(); openWatchlist();
  };
  showDrawer();
}
// Opening the panel adds a history entry, so the phone's back gesture (or the
// browser back button) closes the panel instead of leaving the page.
function showDrawer() {
  if (!document.body.classList.contains("open")) {
    history.pushState({ drawer: true }, "");
    el("detail").scrollTop = 0;
  }
  document.body.classList.add("open");
}
const hideDrawer = () => document.body.classList.remove("open");
const closeDetail = () => { if (history.state && history.state.drawer) history.back(); else hideDrawer(); };
window.addEventListener("popstate", hideDrawer);

function step(n) {
  cursor = mode === "month" ? new Date(cursor.getFullYear(), cursor.getMonth() + n, 1) : addDays(monday(cursor), 7 * n);
  cursor = clamp(cursor);
  render();
}

el("dow").innerHTML = ["Mon", "Tue", "Wed", "Thu", "Fri"].map(d => `<div class="dow">${d}</div>`).join("");
el("prev").onclick = () => step(-1);
el("next").onclick = () => step(1);
el("today").onclick = () => { cursor = clamp(new Date()); render(); };
el("view-month").onclick = () => { mode = "month"; render(); };
el("view-week").onclick = () => { mode = "week"; render(); };
el("search").oninput = render;
el("sector").onchange = render;
el("scope").onchange = render;
el("edit-watch").onclick = openWatchlist;
el("close").onclick = closeDetail;
el("shade").onclick = closeDetail;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
render();
</script>
</body>
</html>
